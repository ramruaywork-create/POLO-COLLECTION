<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>จัดโซนหยิบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f0f2f5; --text:#1d2330; --muted:#6b7385; --line:#dfe3ea;
  --accent:#2563eb; --accent-soft:#dbe6ff; --shelf:#ffffff; --grid:#e3e7ee; --hl:#f59e0b;
  --pick:#e8f7ee; --pick-b:#86cfa0; --pick-t:#1d6b3b;
  --reserve:#eaf0fd; --reserve-b:#8fa9ec; --reserve-t:#2747a0;
  --deep:#f1eef6; --deep-b:#b3a6cc; --deep-t:#5b4a7a;
  --t1:#4b5563; --t2:#4b5563; --t3:#4b5563; --t4:#4b5563; --aisle:#d9dce2; --floor:#ffffff; --shelf-bg:#f6f1de; --shelf-b:#b9ad7c; --A:#5aad78; --B:#dba54a; --C:#b4bac4; --bad:#dc2626;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141a; --surface:#1a1f28; --surface2:#222934; --text:#e6e9ef; --muted:#9aa3b5; --line:#2e3644;
    --accent:#5b8cff; --accent-soft:#1f2c4d; --shelf:#232a35; --grid:#1d232d;
    --pick:#14281c; --pick-b:#2f7a4a; --pick-t:#8fe0ad;
    --reserve:#18223a; --reserve-b:#3d5aa8; --reserve-t:#a9bfff;
    --deep:#221d2e; --deep-b:#5a4d78; --deep-t:#c9b9ec;
    --C:#6b7385; --t1:#6b7385; --t2:#6b7385; --t3:#6b7385; --t4:#6b7385; --aisle:#2a303a; --floor:#161a21; --shelf-bg:#34322a; --shelf-b:#7d7350;
  }
}
:root[data-theme="dark"]{
  --bg:#11141a; --surface:#1a1f28; --surface2:#222934; --text:#e6e9ef; --muted:#9aa3b5; --line:#2e3644;
  --accent:#5b8cff; --accent-soft:#1f2c4d; --shelf:#232a35; --grid:#1d232d;
  --pick:#14281c; --pick-b:#2f7a4a; --pick-t:#8fe0ad;
  --reserve:#18223a; --reserve-b:#3d5aa8; --reserve-t:#a9bfff;
  --deep:#221d2e; --deep-b:#5a4d78; --deep-t:#c9b9ec;
  --C:#6b7385; --t1:#6b7385; --t2:#6b7385; --t3:#6b7385; --t4:#6b7385; --aisle:#2a303a; --floor:#161a21; --shelf-bg:#34322a; --shelf-b:#7d7350;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 'Kanit',system-ui,sans-serif;font-weight:300}
button,input,select,textarea{font:inherit;color:inherit}
b,strong,h1,h2,h3,summary{font-weight:500}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header h1{font-size:19px;margin:0 8px 0 0;white-space:nowrap}
.search{flex:1 1 220px;display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.search input{border:0;background:transparent;outline:0;padding:8px 0;width:100%}
.seg{display:flex;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:2px 8px;font-size:13px}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
#result{padding:0 16px;display:flex;flex-wrap:wrap;gap:8px}
#result:not(:empty){padding:10px 16px 0}
.chip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font-size:14px}
.chip.ok{border-color:var(--A)} .chip.warn{border-color:var(--B)} .chip.bad{border-color:var(--bad);color:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:16px;padding:16px}
@media (max-width:1000px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.mapwrap{overflow:auto;padding:14px;max-height:calc(100vh - 150px)}
#map{position:relative;background-color:var(--surface);border-radius:10px;touch-action:none;margin:0 auto}
.edit #map{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--cell) var(--cell)}
.zone{position:absolute;border:2px dashed;border-radius:8px;pointer-events:none}
.zone.pick{background:transparent;border-color:transparent} .zone.pick .zl{color:var(--pick-t)}
.zone.reserve{background:var(--reserve);border-color:var(--reserve-b)} .zone.reserve .zl{color:var(--reserve-t)}
.zone.deep{background:var(--deep);border-color:var(--deep-b)} .zone.deep .zl{color:var(--deep-t)}
.zone .zl{position:absolute;left:8px;top:2px;font-size:12px;font-weight:500;white-space:nowrap}
.zone.dim{opacity:.3}
.area{position:absolute;pointer-events:none}
.area.aisle{background:var(--aisle)}
.area.aisle::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(255,255,255,.06) 14px 15px)}
.area.floor{background:var(--floor);border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.shelf{position:absolute;background:color-mix(in srgb,var(--c,transparent) 22%,var(--shelf-bg));color:var(--text);border:1px solid var(--shelf-b);border-radius:5px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px 2px;cursor:pointer;user-select:none;transition:opacity .15s,box-shadow .15s,transform .15s;overflow:hidden}
.shelf:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.shelf .fill{position:absolute;left:0;bottom:0;height:3px;width:var(--f);background:var(--c);border-radius:0 2px 0 0}
.shelf.vert .fill{width:3px;height:var(--f);border-radius:0 2px 0 0}
.shelf .code,.shelf .pct{position:relative;white-space:nowrap;line-height:1}
.shelf .code{font-weight:600;font-size:var(--fs);letter-spacing:.2px}
.shelf .pct{font-size:calc(var(--fs) - 2px);color:var(--muted);font-variant-numeric:tabular-nums}
.shelf.vert{writing-mode:vertical-rl;padding:8px 0 8px 2px}
.shelf.vert .code,.shelf.vert .pct{transform:rotate(180deg)}
.shelf.empty{background:var(--surface);border-color:color-mix(in srgb,var(--shelf-b) 55%,transparent)}
.shelf.empty .code{color:var(--muted);font-weight:500}
.shelf.sel{box-shadow:0 0 0 3px var(--accent)}
.shelf.hl{border-color:var(--hl);box-shadow:0 0 0 3px var(--hl);animation:pulse 1.4s infinite}
.shelf.dim{opacity:.25}
.shelf .badge{position:absolute;right:0;top:0;background:var(--hl);color:#111;font-size:11px;font-weight:600;padding:0 5px;border-radius:0 4px 0 6px;line-height:1.4}
.edit .shelf{cursor:grab}
#stage{position:relative}
.tn{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:4px;color:#fff;font-size:10px;font-weight:700;line-height:1;padding:0 3px;background:var(--tc);margin-right:3px;vertical-align:1px}

.shelf .code{display:inline-flex;align-items:center}
.shelf.tdim,.s3.tdim .f,.s3.tdim .lbl{opacity:.15}
.typebar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.typebar .tt{font-size:13px;color:var(--muted);align-self:center}
.typebar button{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 5px;cursor:pointer;font-size:13px}
.typebar button small{color:var(--muted)}
.typebar button.on{border-color:var(--accent);background:var(--accent-soft)}
.elev{display:block;margin:8px auto;max-width:100%}
.v3 #map{position:absolute;left:50%;top:50%;transform-style:preserve-3d;background:var(--surface2);box-shadow:0 30px 60px rgba(0,0,0,.18)}
.v3 #map .zone,.v3 #map .area{transform-style:flat}
.s3{position:absolute;transform-style:preserve-3d;cursor:pointer}
.s3 .f{position:absolute;background:var(--shelf-bg);border:1px solid var(--shelf-b);box-sizing:border-box}
.s3 .top{inset:0;background:color-mix(in srgb,var(--shelf-bg) 85%,#fff)}
.s3 .south{left:0;transform-origin:bottom;transform:rotateX(-90deg);display:flex;flex-direction:column-reverse;background:color-mix(in srgb,var(--shelf-bg) 85%,#000)}
.s3 .west{left:0;top:0;transform-origin:left;transform:rotateY(-90deg);display:flex;flex-direction:row;background:color-mix(in srgb,var(--shelf-bg) 70%,#000)}
.s3 .f i{flex:1;border-top:1px solid var(--shelf-b);background:linear-gradient(var(--dir),color-mix(in srgb,var(--c) 60%,var(--shelf-bg)) var(--f),transparent var(--f))}
.s3 .west i{border-top:0;border-left:1px solid var(--shelf-b)}
.s3 .lbl{position:absolute;left:50%;top:50%;transform-origin:0 0;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
.s3 .lbl small{font-weight:400;color:var(--muted);margin-left:4px}
.s3 .f{transition:background-color .15s,opacity .15s,border-color .15s}
/* X-ray: ชี้ตู้ไหน ตู้ที่อยู่ด้านหน้าและบังตู้นั้นจะโปร่งใส */
.s3.xray{pointer-events:none}
.s3.xray .f{background-color:transparent;border-color:color-mix(in srgb,var(--muted) 60%,transparent);opacity:.22}
.s3.xray .lbl{opacity:.3}
.s3.focus .f{border-color:var(--accent);border-width:1.5px}
.s3.focus .lbl{border-color:var(--accent);background:var(--accent);color:#fff;z-index:2} .s3.focus .lbl small{color:#fff}
.s3.sel .top{background:color-mix(in srgb,var(--accent) 35%,var(--shelf-bg))} .s3.sel .lbl{border-color:var(--accent);color:var(--accent)}
.s3.hl .top{background:var(--hl)} .s3.hl .lbl{background:var(--hl);color:#111;border-color:var(--hl)}
.s3.dim .f,.s3.dim .lbl{opacity:.2}
.s3.over .lbl{border-color:var(--bad)}
.preview-banner{background:var(--accent);color:#fff;font-size:13px;padding:4px 12px;border-radius:8px;margin-bottom:8px;display:inline-block}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:10px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{border-bottom-color:var(--accent);font-weight:500;color:var(--accent)}
.tabs .xtra{display:none}.tabs.more .xtra{display:block}
.tabs #moreBtn{flex:0 0 auto;color:var(--muted,#888)}
.pbody{padding:14px 16px;max-height:calc(100vh - 200px);overflow:auto}
@media (max-width:1000px){.pbody,.mapwrap{max-height:none}}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:15px;margin:16px 0 8px}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.pick{background:var(--pick);color:var(--pick-t);border:1px solid var(--pick-b)}
.pill.reserve{background:var(--reserve);color:var(--reserve-t);border:1px solid var(--reserve-b)}
.pill.deep{background:var(--deep);color:var(--deep-t);border:1px solid var(--deep-b)}
.pill.none{background:var(--surface2);color:var(--muted)}
.pill.A{background:color-mix(in srgb,var(--A) 18%,transparent);color:var(--A)}
.pill.B{background:color-mix(in srgb,var(--B) 18%,transparent);color:var(--B)}
.pill.C{background:color-mix(in srgb,var(--C) 22%,transparent);color:var(--muted)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.level{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;background:var(--surface2)}
.lv-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--A)}
.bar i.over{background:var(--bad)}
.item{display:flex;align-items:center;gap:8px;padding:3px 0}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=number],input[type=text],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 7px;min-width:0}
input[type=number]{width:70px}
textarea{width:100%;min-height:90px;font-family:ui-monospace,monospace;font-size:13px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row>label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:500;color:var(--muted);font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover{background:var(--surface2)}
.tbl-in input{width:58px}
.tbl-in input[type=text]{width:100%}
.mx{overflow-x:auto;margin:8px 0}
.mx table{font-size:12px;width:auto}
.mx td,.mx th{padding:2px;border:0;text-align:center}
.mx th.cl{text-align:left;padding-right:6px;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.mx td.c{min-width:34px;height:26px;border-radius:5px;cursor:pointer;font-variant-numeric:tabular-nums}
.mx td.A{background:color-mix(in srgb,var(--A) 30%,transparent)}
.mx td.B{background:color-mix(in srgb,var(--B) 28%,transparent)}
.mx td.C{background:color-mix(in srgb,var(--C) 20%,transparent);color:var(--muted)}
.mx td.z{background:transparent;color:var(--muted);outline:1px dashed var(--line)}
.mx td.on{outline:2px solid var(--accent)}
.big{font-size:26px;font-weight:600;line-height:1.1}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat .big{font-size:20px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0}
details>summary{cursor:pointer}
.plan-lv{font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.plan-lv:last-child{border:0}
.empty-state{text-align:center;padding:40px 10px;color:var(--muted)}
.warnbox{border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>📦 จัดโซนหยิบ</h1>
  <div class="search">🔍<input id="q" type="text" placeholder="ค้นหา เช่น  ดำ M  /  Basic ขาว  /  SKU"></div>
  <button class="btn" id="viewBtn" title="สลับมุมมอง 2D / 3D">🧊 3D</button>
  <button class="btn" id="themeBtn" title="สลับโหมดมืด/สว่าง">🌙</button>
  <button class="btn" id="editBtn">✏️ แก้ไขผัง</button>
</header>
<div id="result"></div>
<main>
  <section class="card">
    <div class="mapwrap"><div id="banner"></div><div id="stage"><div id="map"></div></div></div>
    <div class="typebar" id="typebar"></div>
    <div class="legend">
      <span>สีทึบในตู้ = ใช้ไปกี่ %:</span>
      <span><i style="background:var(--aisle)"></i>ทางเดิน</span>
      <span><i style="background:var(--A)"></i>A ขายดี</span>
      <span><i style="background:var(--B)"></i>B พอขายได้</span>
      <span><i style="background:var(--C)"></i>C ขายช้า</span>
      <span><i style="background:var(--bad)"></i>เกินความจุ</span>
      <span id="editHint" hidden>โหมดแก้ไข: ลากชั้นวางเพื่อย้ายตำแหน่ง</span>
    </div>
  </section>
  <aside class="card">
    <div class="tabs" id="tabs">
      <button data-tab="start">① นำเข้ายอดขาย</button>
      <button data-tab="plan">② ผลจัดโซนหยิบ</button>
      <button data-tab="detail">ชั้นวาง</button>
      <button id="moreBtn" title="เครื่องมืออื่น ๆ">⋯</button>
      <button class="xtra" data-tab="products">สินค้า/กฎ</button>
      <button class="xtra" data-tab="cap">ความจุ</button>
      <button class="xtra" data-tab="layout">ตั้งค่าผัง</button>
    </div>
    <div class="pbody" id="panel"></div>
  </aside>
</main>
<div class="toast" id="toast"></div>

<script>
let CELL = 24;
const KEY = 'wh2d-pick-v3';
const ZT = { pick: 'โซนหยิบ', reserve: 'สต็อกสำรอง', deep: 'สต็อกเก็บลึก', none: 'นอกโซน' };
const CLS_TXT = { A: 'A ขายดี', B: 'B พอขายได้', C: 'C ขายช้า' };
const PERMS = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Math.max(0, parseFloat(v) || 0);
const int = v => Math.max(0, Math.floor(parseFloat(v) || 0));
const fmt = n => Number(n).toLocaleString('th-TH');
const byCode = (a, b) => a.code.localeCompare(b.code, undefined, { numeric: true });

/* ================= ข้อมูลตัวอย่าง ================= */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genModel(R, { brand, model, code, colors, sizes, box, perBox, base, cw, sw }) {
  return colors.flatMap((c, ci) => sizes.map((s, si) => {
    const sales = Math.round(base * (cw ? cw[ci] : 1) * (sw ? sw[si] : 1) * (0.6 + R() * 0.8));
    const stock = Math.round(sales * (0.8 + R() * 1.4) + 5 + R() * 25);
    return { id: uid(), brand, model, color: c, size: s, sku: `${code}-${ci + 1}-${s}`, box, perBox, sales30: sales, stock };
  }));
}
function seed() {
  const R = rng(7);
  // จำนวนกล่องต่อชั้น นับจากรูปชั้นวางจริง (cap = จำนวนกล่องแต่ละประเภทที่ใส่ได้)
  const levelTypes = [
    { id: 'S1', name: 'ช่องบนใหญ่ 2 ช่อง', w: 0, d: 0, h: 0, cap: { B1: 24 } },
    { id: 'S2', name: 'ช่องล่าง 3 ช่อง', w: 0, d: 0, h: 0, cap: { B2: 18 } },

/* ================= นำเข้ายอดขายจากไฟล์ (.xlsx อ่านเองในเบราว์เซอร์ ไม่ต้องใช้ไลบรารี) ================= */
async function readXlsx(buf) {
  const dv = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('ไม่ใช่ไฟล์ xlsx');
  const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let i = 0; i < n; i++) {
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    files[dec.decode(u8.subarray(p + 46, p + 46 + nl))] = { method: dv.getUint16(p + 10, true), csize: dv.getUint32(p + 20, true), lo: dv.getUint32(p + 42, true) };
    p += 46 + nl + xl + cl;
  }
  const read = async name => {
    const f = files[name]; if (!f) return null;
    const s = f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true), data = u8.subarray(s, s + f.csize);
    if (f.method === 0) return dec.decode(data);
    return dec.decode(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  };
  const xml = s => new DOMParser().parseFromString(s, 'application/xml');
  const text = el => [...el.getElementsByTagName('t')].map(t => t.textContent).join('');
  const sst = await read('xl/sharedStrings.xml'), ss = sst ? [...xml(sst).getElementsByTagName('si')].map(text) : [];
  const sheet = Object.keys(files).filter(k => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a, b) => parseInt(a.match(/\d+/g).pop()) - parseInt(b.match(/\d+/g).pop()))[0];
  if (!sheet) throw new Error('ไม่พบชีตในไฟล์');
  const rows = [];
  for (const r of xml(await read(sheet)).getElementsByTagName('row')) {
    const row = []; let k = 0;
    for (const c of r.getElementsByTagName('c')) {
      const ref = (c.getAttribute('r') || '').replace(/\d+/g, '');
      if (ref) k = ref.split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1;
      const t = c.getAttribute('t'), v = c.getElementsByTagName('v')[0];
      row[k++] = t === 'inlineStr' ? text(c) : t === 's' && v ? ss[+v.textContent] : v ? v.textContent : '';
    }
    rows.push(row);
  }
  return rows;
}
// rows = แถว×คอลัมน์ ถ้ามีหัวตารางที่มีคำว่า SKU / จำนวน / สถานะ จะใช้คอลัมน์ตามนั้น ไม่งั้นถือว่า A=SKU, B=จำนวน
// ออเดอร์ที่สถานะเป็นยกเลิก/คืน ไม่นับเป็นยอดขาย
function parseSalesRows(rows) {
  const CANCEL = /cancel|ยกเลิก|return|refund|คืนสินค้า|คืนเงิน/i;
  let sk = 0, qc = 1, st = -1, start = 0;
  const hi = rows.slice(0, 5).findIndex(r => r.some(c => /sku/i.test(c)));
  if (hi >= 0) {
    const h = Array.from(rows[hi], c => String(c ?? '')); start = hi + 1;
    sk = h.findIndex(c => /sku.*merchant|merchant.*sku/i.test(c)); if (sk < 0) sk = h.findIndex(c => /sku/i.test(c));
    qc = h.findIndex(c => /จำนวน|qty|quantity/i.test(c));
    st = h.findIndex(c => /สถานะ|status/i.test(c));
  }
  const tot = new Map(); let used = 0, cancelled = 0, blank = 0, pcs = 0;
  for (const r of rows.slice(start)) {
    const sku = String(r[sk] ?? '').trim();
    if (!sku) { if (r.some(c => String(c ?? '').trim())) blank++; continue; }
    if (st >= 0 && CANCEL.test(String(r[st] ?? ''))) { cancelled++; continue; }
    const raw = qc < 0 ? '' : String(r[qc] ?? '').trim(), q = raw === '' ? 1 : parseFloat(raw.replace(/,/g, ''));
    if (isNaN(q) || q < 0) continue;
    const k = sku.toLowerCase(); tot.set(k, (tot.get(k) || 0) + q); used++; pcs += q;
  }
  return { tot, used, cancelled, blank, pcs };
}

  entries.sort((a, b) => mv[b.p.model] - mv[a.p.model] || a.p.model.localeCompare(b.p.model)
    || cv[b.p.model + '|' + b.p.color] - cv[a.p.model + '|' + a.p.color] || a.p.color.localeCompare(b.p.color)

  return groups;

function fill(slots, groups, keepColor = false) {

  const put = (s, p, n) => { const it = s.items.find(i => i.pid === p.id); if (it) it.boxes += n; else s.items.push({ pid: p.id, boxes: n }); s.frac += n / fitLP(s.L, p); };
  for (const g of groups) {

      // ถ้าสีนี้ใส่ชั้นปัจจุบันไม่หมด แต่ใส่ชั้นถัดไปได้หมด → ขึ้นชั้นใหม่ ไม่ให้สีเดียวกันแตกหลายที่

function spreadFill(pool, entries, keepColor) {

  const byModel = new Map();
  for (const g of groupEntries(entries)) { const m = g[0].p.model; if (!byModel.has(m)) byModel.set(m, []); byModel.get(m).push(g); }

    const score = sh => {
      if (!pool.some(s => s.sh === sh && s.frac < 1 - 1e-6)) return -1;      // เต็มแล้ว
      if (used.includes(sh)) return 0;                                         // มีรุ่นอื่นอยู่แล้ว ใช้เป็นที่สำรองสุดท้าย

    const order = shelves.map(sh => ({ sh, sc: score(sh) })).sort((a, b) => b.sc - a.sc || byCode(a.sh, b.sh)).map(o => o.sh);

function buildPlan() {
  const st = DB.settings, pick = [], toStock = [], acc = [];
  for (const p of DB.products) {
    if (!brandOK(p)) continue; // ไม่ใช่แบรนด์ที่เลือกให้ขึ้นโซนหยิบ
    // ไม่ใช้สต็อก (ค่าเริ่มต้น): คิดจากยอดขายอย่างเดียว = จำนวนช่องที่ต้องมีให้พอขาย "cover" วัน
    const boxes = st.useStock ? boxesOf(p) : (p.sales30 > 0 ? Math.max(1, Math.ceil(p.sales30 / 30 * st.cover / ppb(p))) : 0);
    if (!boxes) continue;
    if (noPick(p)) { toStock.push({ p, boxes }); continue; } // ใส่กล่องโซนหยิบไม่ได้ → เก็บสต็อกเสมอ
    // อุปกรณ์: ไม่แย่งที่กับเสื้อ — เก็บไว้เติมช่องว่างที่เหลือหลังจัดเสื้อเสร็จ
    if (catOf(p) === 'acc') {

      if (want) acc.push({ p, boxes: want });
      if (boxes - want) toStock.push({ p, boxes: boxes - want });
      continue;
    }
    const c = CLS[p.id];
    // A: โซนหยิบเก็บพอขาย "cover" วัน · B: 1 กล่อง (ถ้าเปิดไว้) · C: ไม่ขึ้นโซนหยิบ — ที่เหลือส่งเข้าสต็อก
    const pk = c === 'A' ? Math.min(boxes, Math.max(1, Math.ceil(p.sales30 / 30 * st.cover / ppb(p))))
      : c === 'B' && st.bPick ? 1 : 0;

  const bm = st.brandMap || DEFAULT_BRAND_MAP;

    bm.forEach((m, i) => { if (exclSlots[i].length) left.push(...spreadFill(exclSlots[i], entries.filter(e => bidx(e.p) === i), keepColor)); else left.push(...entries.filter(e => bidx(e.p) === i)); });

    if (room()) place(sellers.filter(p => catOf(p) === 'acc' && !accIds.has(p.id)).map(p => ({ p, boxes: Math.min(cap(p), Math.max(1, need(p, 1))) })));
    for (let r = 2; r <= 6 && !st.useStock && room(); r++) {

/* ================= วาดผัง ================= */

// รูปหน้าตู้: เรียงกล่องตามจริง (cols = จำนวนกล่องต่อแถว) ระบายสีตามกลุ่มสินค้าที่วางอยู่
const DEF_COLS = { S1: 8, S2: 9, S3: 2, S4: 4, S5: 3, T3: 2, T5: 3 };

  }

      // ช่องหยิบในกล่อง: ระบายสีตามกลุ่มของ SKU ที่อยู่ในช่องนั้น

function contents(items) {

  return [...grp].map(([k, v]) => `${k} (${v})`).join(', ');

function renderMap() {

  m.style.setProperty('--cell', CELL + 'px');
  m.style.setProperty('--fs', Math.max(10, Math.min(14, Math.round(CELL * 0.42))) + 'px');
  m.style.width = DB.map.cols * CELL + 'px';

  m.parentElement.classList.toggle('edit', ui.edit);

    const W = DB.map.cols * CELL, Hm = DB.map.rows * CELL, a = 30 * Math.PI / 180, t = 55 * Math.PI / 180;
    const pw = W * Math.cos(a) + Hm * Math.sin(a), ph = (W * Math.sin(a) + Hm * Math.cos(a)) * Math.cos(t) + 260;
    const sc = Math.min(1.5, avail / pw);

  $('#banner').innerHTML = preview() ? `<span class="preview-banner">👁 กำลังแสดงผังตาม “แผนใหม่” (ยังไม่ได้บันทึก)</span>` : '';

  }

  for (const sh of DB.shelves) {
    const lv = sh.levels.map((L, li) => { const items = itemsOf(sh, li); return { f: usedFrac(L, items), c: domClass(items), items }; });
    const avg = lv.length ? lv.reduce((a, x) => a + x.f, 0) / lv.length : 0;
    let cls = 'shelf';
    if (sh.h > sh.w) cls += ' vert';
    if (avg === 0) cls += ' empty';
    if (ui.sel === sh.id) cls += ' sel';
    let badge = '';
    if (ids.size) {
      let q = 0; lv.forEach(x => x.items.forEach(it => { if (ids.has(it.pid)) q += it.boxes; }));
      if (q > 0) { cls += ' hl'; badge = `<span class="badge">${fmt(q)} ช่อง</span>`; } else cls += ' dim';
    }
    const all = lv.flatMap(x => x.items), c = avg > 1.0001 ? 'bad' : domClass(all);
    const ti = stIdx(sh); if (ui.tf !== null && ti !== ui.tf) cls += ' tdim';
    const g = 3, pctTxt = avg === 0 ? 'ว่าง' : Math.round(avg * 100) + '%';
    const tip = esc(`${sh.code} · ${sh.levels.length} ชั้น · ใช้ไป ${Math.round(avg * 100)}%\n` + lv.map((x, li) => `ชั้น ${li + 1}: ` + (contents(x.items) || 'ว่าง')).reverse().join('\n'));
    const box = `left:${sh.x * CELL + g}px;top:${sh.y * CELL + g}px;width:${sh.w * CELL - g * 2}px;height:${sh.h * CELL - g * 2}px`;
    if (v3) {
      const W = sh.w * CELL - g * 2, D = sh.h * CELL - g * 2, H = Math.round(CELL * 0.55 * 2.5 * 4); // ทุกตู้สูงเท่ากัน แบ่งแถบตามจำนวนชั้นของตู้นั้น
      const band = (dir) => lv.map(x => `<i style="--dir:${dir};--f:${Math.min(100, x.f * 100)}%;--c:var(--${x.f > 1.0001 ? 'bad' : x.c})"></i>`).join('');
      const q = badge ? ` · ${badge.replace(/<[^>]+>/g, '')}` : '';

  m.innerHTML = h; xT = null;
  renderTypebar();

/* ================= ผลการค้นหา ================= */
function renderResult() {
  const el = $('#result');
  if (!ui.q.trim() && !ui.focus) { el.innerHTML = ''; return; }
  const ids = matchedIds();
  if (!ids.length) { el.innerHTML = `<span class="chip bad">❌ ไม่พบ “${esc(ui.q)}” ในระบบ</span>`; return; }
  let h = '';
  if (ids.length > 1) {
    const ps = ids.map(prod), stock = ps.reduce((a, p) => a + p.stock, 0), zero = ps.filter(p => !p.stock).length;
    h += `<span class="chip"><b>พบ ${ids.length} SKU</b> · สต็อกรวม ${fmt(stock)} ชิ้น${zero ? ` · <span style="color:var(--bad)">หมด ${zero} SKU</span>` : ''}</span>`;
  }
  h += ids.slice(0, 8).map(id => {
    const p = prod(id), locs = locations(id);
    const st = !p.stock ? 'bad' : !locs.length ? 'warn' : 'ok';
    const icon = { bad: '❌', warn: '⚠️', ok: '✅' }[st];
    const where = locs.slice(0, 3).map(l => `${l.sh.code}-${l.li + 1}`).join(', ') + (locs.length > 3 ? '…' : '');
    return `<span class="chip ${st}" data-act="focus" data-pid="${id}">${icon} <b>${esc(pname(p))}</b>
      ${!p.stock ? 'ไม่มีของ' : `${fmt(p.stock)} ชิ้น ${where ? '📍' + esc(where) : '(ยังไม่ได้วางบนชั้น)'}`}</span>`;
  }).join('');
  if (ids.length > 8) h += `<span class="chip">+ อีก ${ids.length - 8}</span>`;
  if (ui.focus) h += `<span class="chip" data-act="clearfocus">✕ ล้าง</span>`;
  el.innerHTML = h;
}

      return `<tr class="click" data-act="focus" data-pid="${p.id}"><td>${esc(p.sku)}${catOf(p) === 'acc' ? ' <span class="muted small">อุปกรณ์</span>' : ''}</td><td class="n">${p.sales30}</td><td>${CLS[p.id]}</td><td>${esc(now)}</td><td>${to}</td></tr>`;

  <h3>แผนการวางโซนหยิบ</h3>`;
  const bySh = new Map();
  sl.forEach(s => { if (!bySh.has(s.sh)) bySh.set(s.sh, []); bySh.get(s.sh).push(s); });
  for (const [sh, ss] of bySh) {
    const total = ss.reduce((a, s) => a + sumB(s.items), 0);
    h += `<details><summary><span class="pill pick">${esc(sh.code)}</span> <span class="small muted">${fmt(total)} ช่อง</span></summary>
      ${ss.slice().sort((a, b) => b.li - a.li).map(s => {
        const lt = ltype(s.L.t), grp = new Map();
        s.items.forEach(it => { const p = prod(it.pid), k = p.model + ' · ' + p.color; if (!grp.has(k)) grp.set(k, []); grp.get(k).push(`${p.size}×${it.boxes}`); });
        return `<div class="plan-lv"><b>ชั้น ${s.li + 1}</b> <span class="muted">${esc(lt.name)} ${Math.round(s.frac * 100)}%</span><br>
          ${[...grp].map(([k, v]) => `${esc(k)}: <span class="muted">${esc(v.join(' '))}</span>`).join('<br>') || '<span class="muted">— ว่าง —</span>'}</div>`;
      }).join('')}</details>`;
  }
  return h;
}

/* ================= การกระทำ ================= */
function render() {
  CLS = classify();
  PLAN = ui.tab === 'plan' ? buildPlan() : null;
  renderMap(); renderResult(); renderPanel(); save();
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2400); }
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
}
const csv = rows => '﻿' + rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');

// นำผลจาก parseSalesRows (รวมหลายไฟล์ได้) ไปใส่ยอดขาย 30 วันของแต่ละ SKU
function applySales({ tot, used, cancelled, blank, pcs }, days, zero, files) {
  const by = new Map(DB.products.map(p => [String(p.sku).toLowerCase(), p]));
  let hit = 0, miss = 0;
  for (const [k, q] of tot) { const p = by.get(k); if (p) { p.sales30 = Math.round(q / days * 30 * 10) / 10; hit++; } else miss++; }
  if (!hit) return toast('ไม่พบ SKU ในไฟล์ตรงกับระบบเลย — เช็กคอลัมน์ SKU');
  if (zero) for (const p of DB.products) if (!tot.has(String(p.sku).toLowerCase())) p.sales30 = 0;
  DB.salesInfo = { days, hit, at: new Date().toLocaleString('th-TH'), pcs, used, cancelled, blank, miss, files };
  const cls = classify(), a = DB.products.filter(p => cls[p.id] === 'A').length;
  toast(`${files > 1 ? files + ' ไฟล์ · ' : ''}ยอดขาย ${fmt(pcs)} ชิ้น (${fmt(used)} รายการ) ใน ${days} วัน · ตรงระบบ ${fmt(hit)} SKU` + (miss ? ` · ไม่พบ ${fmt(miss)}` : '') + (cancelled ? ` · ไม่นับยกเลิก ${fmt(cancelled)}` : '') + ` · กลุ่ม A ${fmt(a)} SKU`);
}

const actions = {
  focus: d => { ui.focus = ui.focus === d.pid ? null : d.pid; if (ui.focus) { ui.openModel = prod(ui.focus).model; ui.tab = 'products'; } },
  clearfocus: () => { ui.focus = null; ui.q = ''; $('#q').value = ''; },
  gotoshelf: d => { ui.sel = d.sid; ui.tab = 'detail'; },
  toggleedit: () => setEdit(!ui.edit),
  apply: () => {
    if (!confirm('จัดโซนหยิบใหม่ตามแผนนี้? (ของบนชั้นตอนนี้จะถูกแทนที่ แนะนำให้ดาวน์โหลดใบจัดของก่อน)')) return;
    const P = buildPlan();
    DB.shelves.forEach(sh => sh.levels.forEach((L, li) => { const s = P.map.get(sh.id + '|' + li); L.items = s ? s.items.map(i => ({ ...i })) : []; }));
    toast('จัดของตามแผนเรียบร้อย');
  },
  exportplan: () => {
    const P = buildPlan(), rows = [['ทำอะไร', 'ชั้นวาง', 'ชั้น', 'SKU', 'รุ่น', 'สี', 'ไซส์', 'กลุ่ม', 'จำนวนช่อง', 'ตำแหน่งเดิม']];
    const old = p => locations(p.id).map(l => `${l.sh.code}-${l.li + 1}`).join(' ');
    for (const s of P.slots.slice().sort((a, b) => byCode(a.sh, b.sh) || a.li - b.li))
      for (const it of s.items) { const p = prod(it.pid); rows.push(['วางโซนหยิบ', s.sh.code, s.li + 1, p.sku, p.model, p.color, p.size, CLS[p.id], it.boxes, old(p)]); }
    P.toStock.forEach(e => rows.push(['เข้าสต็อก', '', '', e.p.sku, e.p.model, e.p.color, e.p.size, CLS[e.p.id], e.boxes, old(e.p)]));
    download('ใบจัดของ-' + new Date().toISOString().slice(0, 10) + '.csv', csv(rows), 'text/csv');
  },
  additem: d => {
    const sh = shelf(ui.sel), L = sh.levels[d.li];
    const pid = document.querySelector(`[data-addsel="${d.li}"]`).value, n = int(document.querySelector(`[data-addqty="${d.li}"]`).value);
    if (!pid || !n) return;
    const r = remaining(L, prod(pid));
    if (n > r && !confirm(`ชั้นนี้ใส่ได้อีกแค่ ${r} ช่อง จะเพิ่ม ${n} ช่องอยู่ดีไหม?`)) return;
    const it = L.items.find(i => i.pid === pid); if (it) it.boxes += n; else L.items.push({ pid, boxes: n });
  },
  delitem: d => shelf(ui.sel).levels[d.li].items.splice(d.ii, 1),
  addlevel: () => { const sh = shelf(ui.sel); sh.levels.push({ t: (sh.levels[sh.levels.length - 1] || DB.levelTypes[0]).t || DB.levelTypes[0].id, items: [] }); },
  dellevel: d => { const sh = shelf(ui.sel); if (sh.levels[d.li].items.length && !confirm('ชั้นนี้มีของอยู่ ลบเลยไหม?')) return; sh.levels.splice(d.li, 1); },
  addshelf: () => {
    const sh = { id: uid(), code: 'S' + (DB.shelves.length + 1), x: 1, y: DB.map.rows - 1, w: 4, h: 1, levels: ((DB.shelfTypes || [])[+($('#newST') || {}).value || 0] || { levels: [DB.levelTypes[0].id] }).levels.map(t => ({ t, items: [] })) };
    DB.shelves.push(sh); ui.sel = sh.id; ui.tab = 'detail'; setEdit(true); toast('เพิ่มชั้นวางที่มุมล่างซ้าย ลากไปวางที่ที่ต้องการ');
  },
  dupshelf: () => {
    const s = shelf(ui.sel), c = JSON.parse(JSON.stringify(s));
    c.id = uid(); c.code = s.code + '-2'; c.y = Math.min(DB.map.rows - c.h, s.y + s.h + 1); c.levels.forEach(L => L.items = []);
    DB.shelves.push(c); ui.sel = c.id;
  },
  delshelf: () => { if (!confirm('ลบชั้นวางนี้และของทั้งหมดในนั้น?')) return; DB.shelves = DB.shelves.filter(s => s.id !== ui.sel); ui.sel = null; },
  delprod: () => {
    if (!confirm('ลบ SKU นี้ออกจากระบบ?')) return;
    DB.products = DB.products.filter(p => p.id !== ui.focus);
    DB.shelves.forEach(s => s.levels.forEach(L => L.items = L.items.filter(i => i.pid !== ui.focus))); ui.focus = null;
  },
  delmodel: d => {
    if (!confirm(`ลบรุ่น “${d.m}” ทุก SKU?`)) return;
    const ids = new Set(DB.products.filter(p => p.model === d.m).map(p => p.id));
    DB.products = DB.products.filter(p => !ids.has(p.id));
    DB.shelves.forEach(s => s.levels.forEach(L => L.items = L.items.filter(i => !ids.has(i.pid)))); ui.focus = null;
  },
  addmodel: () => {
    const v = id => $(id).value.trim(), split = s => s.split(/[,，]/).map(x => x.trim()).filter(Boolean);
    const model = v('#nmModel'), colors = split(v('#nmColors')), sizes = split(v('#nmSizes'));
    if (!model || !colors.length || !sizes.length) return toast('กรอกชื่อรุ่น สี และไซส์ให้ครบ');
    const code = v('#nmCode') || model.slice(0, 3).toUpperCase();
    colors.forEach((c, ci) => sizes.forEach(s => DB.products.push({ id: uid(), brand: v('#nmBrand'), model, color: c, size: s,
      sku: `${code}-${ci + 1}-${s}`, box: $('#nmBox').value, perBox: Math.max(1, int($('#nmPer').value)), sales30: 0, stock: 0 })));
    ui.openModel = model; toast(`สร้าง ${colors.length * sizes.length} SKU แล้ว ใส่ยอดขาย/สต็อกด้วยการวางจาก Excel ได้`);
  },
  paste: () => {
    let ok = 0, miss = [];
    $('#paste').value.split(/\r?\n/).forEach(line => {
      const c = line.split(/\t|,/).map(x => x.trim()); if (!c[0]) return;
      const p = DB.products.find(x => x.sku.toLowerCase() === c[0].toLowerCase());
      if (!p) { if (!/sku/i.test(c[0])) miss.push(c[0]); return; }
      if (c[1] !== undefined && c[1] !== '') p.sales30 = num(c[1]);
      if (c[2] !== undefined && c[2] !== '') p.stock = int(c[2]);
      ok++;
    });
    toast(`อัปเดต ${ok} SKU` + (miss.length ? ` · ไม่พบ ${miss.length} SKU` : ''));
  },
  exportsku: () => download('sku.csv', csv([['SKU', 'ขาย30วัน', 'สต็อก', 'แบรนด์', 'รุ่น', 'สี', 'ไซส์', 'ชิ้นต่อช่อง', 'กลุ่ม']]
    .concat(DB.products.map(p => [p.sku, p.sales30, p.stock, p.brand, p.model, p.color, p.size, p.perBox, CLS[p.id]]))), 'text/csv'),
  addlt: () => DB.levelTypes.push({ id: uid(), name: 'แบบใหม่', w: 0, d: 0, h: 0, cap: {} }),
  dellt: d => {
    const t = DB.levelTypes[d.i];
    if (DB.levelTypes.length < 2) return toast('ต้องมีอย่างน้อย 1 แบบ');
    if (DB.shelves.some(s => s.levels.some(L => L.t === t.id))) return toast('แบบชั้นนี้ยังถูกใช้อยู่ เปลี่ยนชั้นที่ใช้แบบนี้ก่อน');
    DB.levelTypes.splice(d.i, 1);
  },
  addbt: () => DB.boxTypes.push({ id: uid(), name: 'กล่องใหม่', w: 30, d: 30, h: 20 }),
  delbt: d => {
    const t = DB.boxTypes[d.i];
    if (DB.products.some(p => p.box === t.id)) return toast('มีสินค้าใช้กล่องแบบนี้อยู่');
    DB.boxTypes.splice(d.i, 1);
  },
  addzone: () => DB.zones.push({ id: uid(), name: 'โซนใหม่', type: 'pick', x: 0, y: 0, w: 5, h: 4 }),
  delzone: d => DB.zones.splice(d.zi, 1),
  addarea: () => (DB.areas = DB.areas || []).push({ type: 'aisle', x: 0, y: 0, w: 4, h: 2 }),
  delarea: d => DB.areas.splice(d.ai, 1),
  sync: () => { syncCatalog(false); },
  gototab: d => { ui.tab = d.tab; },
  clearsel: () => { ui.sel = null; },
  importstock: () => {
    const rows = $('#stockText').value.split(/\r?\n/).filter(l => l.trim())
      .map(l => l.split(l.includes('\t') ? '\t' : ',').map(x => x.trim().replace(/^"|"$/g, '')));
    let sk = 0, qc = 1, start = 0;
    const hi = rows.slice(0, 5).findIndex(r => r.some(c => /sku/i.test(c)));
    if (hi >= 0) {
      const h = rows[hi]; start = hi + 1;
      sk = h.findIndex(c => /sku.*merchant|merchant.*sku/i.test(c)); if (sk < 0) sk = h.findIndex(c => /sku/i.test(c));
      qc = h.findIndex(c => /สต็อก|สต๊อก|stock|คงเหลือ|คงคลัง|available|on.?hand|จำนวน|qty|quantity/i.test(c));
      if (qc < 0) return toast('ไม่พบคอลัมน์สต็อกในหัวตาราง (ลองตั้งชื่อคอลัมน์ว่า สต็อก)');
    }
    const tot = new Map(); let pcs = 0;
    for (const r of rows.slice(start)) {
      const sku = String(r[sk] ?? '').trim(), q = parseFloat(String(r[qc] ?? '').replace(/,/g, ''));
      if (!sku || isNaN(q)) continue;
      const k = sku.toLowerCase(); tot.set(k, (tot.get(k) || 0) + q);
    }
    const by = new Map(DB.products.map(p => [String(p.sku).toLowerCase(), p]));
    let hit = 0, miss = 0;
    for (const [k, q] of tot) { const p = by.get(k); if (p) { p.stock = Math.max(0, Math.round(q)); pcs += p.stock; hit++; } else miss++; }
    if (!hit) return toast('ไม่พบ SKU ในไฟล์ตรงกับระบบเลย — เช็กคอลัมน์ SKU');
    toast(`ใส่สต็อก ${fmt(hit)} SKU (รวม ${fmt(pcs)} ชิ้น)` + (miss ? ` · ไม่พบในระบบ ${fmt(miss)}` : ''));
  },
  deldemo: () => {
    const ids = new Set(DB.products.filter(isDemo).map(p => p.id));
    if (!ids.size || !confirm(`ลบสินค้าตัวอย่าง ${ids.size} SKU และของตัวอย่างที่วางอยู่บนชั้น?`)) return;
    DB.products = DB.products.filter(p => !ids.has(p.id));
    DB.shelves.forEach(s => s.levels.forEach(L => L.items = L.items.filter(i => !ids.has(i.pid)))); ui.focus = null;
  },
  addrule: () => (DB.rules = DB.rules || []).push({ id: uid(), brand: '', codes: '', perBox: 0, noPick: false }),
  delrule: d => DB.rules.splice(d.i, 1),
  importsales: () => {
    const days = Math.max(1, int($('#salesDays').value) || 90), zero = $('#salesZero').checked;
    const rows = $('#salesText').value.split(/\r?\n/).filter(l => l.trim())
      .map(l => l.split(l.includes('\t') ? '\t' : ',').map(x => x.trim().replace(/^"|"$/g, '')));
    applySales(parseSalesRows(rows), days, zero, 1);
  },
  export: () => download('warehouse-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(persistable(), null, 2), 'application/json'),
  reset: () => { if (confirm('ล้างข้อมูลทั้งหมดและกลับไปใช้ข้อมูลตัวอย่าง?')) { DB = seed(); ui.sel = ui.focus = null; } },
};
function setEdit(v) { ui.edit = v; if (v && ui.view === '3d') setView('2d'); $('#editBtn').classList.toggle('on', v); $('#editBtn').textContent = v ? '✅ เสร็จสิ้นแก้ไข' : '✏️ แก้ไขผัง'; }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const d = { ...t.dataset }; ['li', 'ii', 'zi', 'ai', 'i'].forEach(k => d[k] !== undefined && (d[k] = +d[k]));
  actions[d.act](d); render();
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d.dataset || !d.dataset.model || !d.open) return;
  ui.openModel = d.dataset.model;
  if (!d.querySelector('.mx')) { // รุ่นที่ยังไม่ได้วาดตาราง → วาดใหม่โดยเปิดรุ่นนี้
    const p = $('#panel'), sc = [p, p.parentElement].map(x => x.scrollTop);
    renderPanel();
    p.scrollTop = sc[0]; p.parentElement.scrollTop = sc[1];
  }
}, true);
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset, f = d.f;
  if (el.id === 'salesFile') {
    const files = [...el.files]; if (!files.length) return;
    const days = Math.max(1, int($('#salesDays').value) || 90), zero = $('#salesZero').checked;
    (async () => {
      const all = { tot: new Map(), used: 0, cancelled: 0, blank: 0, pcs: 0 }, bad = [];
      for (const [i, file] of files.entries()) {
        try {
          toast(`กำลังอ่านไฟล์ ${i + 1}/${files.length}: ${file.name}`);
          const rows = /\.xlsx$/i.test(file.name) ? await readXlsx(await file.arrayBuffer())
            : (await file.text()).replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim()).map(l => l.split(l.includes('\t') ? '\t' : ',').map(x => x.trim().replace(/^"|"$/g, '')));
          const r = parseSalesRows(rows);
          for (const [k, q] of r.tot) all.tot.set(k, (all.tot.get(k) || 0) + q);
          all.used += r.used; all.cancelled += r.cancelled; all.blank += r.blank; all.pcs += r.pcs;
        } catch (x) { bad.push(file.name); }
      }
      applySales(all, days, zero, files.length - bad.length);
      if (bad.length) setTimeout(() => toast('อ่านไม่สำเร็จ: ' + bad.join(', ')), 3500);
      render();
    })();
    return;
  }
  if (el.id === 'stockFile') {
    const file = el.files[0]; if (!file) return;
    (async () => {
      try {
        if (/\.xlsx$/i.test(file.name)) $('#stockText').value = (await readXlsx(await file.arrayBuffer())).map(r => Array.from(r, c => String(c ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');
        else $('#stockText').value = (await file.text()).replace(/^﻿/, '');
        actions.importstock({}); render();
      } catch (x) { toast('อ่านไฟล์ไม่สำเร็จ: ' + (x.message || x)); }
    })();
    return;
  }
  if (el.id === 'imp') {
    const file = el.files[0]; if (!file) return;
    file.text().then(txt => { try { const j = JSON.parse(txt); if (!j.shelves || !j.products || !j.levelTypes) throw 0; DB = j; ui.sel = ui.focus = null; render(); toast('นำเข้าข้อมูลแล้ว'); syncCatalog(true); } catch (x) { toast('ไฟล์ไม่ถูกต้อง'); } });
    return;
  }
  if (f === 'rule') {
    const r = (DB.rules || [])[+d.i]; if (!r) return;
    r[d.k] = d.k === 'noPick' ? el.checked : d.k === 'perBox' ? num(el.value) : el.value;
    render(); return;
  }
  if (!f) return;
  const sh = shelf(ui.sel), str = ['name', 'type', 'code', 'sizeOrder', 'brandOnly'].includes(d.k);
  if (f === 'qty') { const L = sh.levels[+d.li]; const q = int(el.value); if (q) L.items[+d.ii].boxes = q; else L.items.splice(+d.ii, 1); }
  else if (f === 'stype') {
    const st = DB.shelfTypes[+el.value]; if (!st) return;
    const old = sh.levels;
    if (old.some(L => L.items.length) && !confirm('เปลี่ยนแบบแล้ว ของในชั้นที่เกินจำนวนชั้นใหม่จะหาย ดำเนินการต่อไหม?')) { render(); return; }
    sh.levels = st.levels.map((t, i) => ({ t, items: old[i] ? old[i].items : [] }));
  }
  else if (f === 'lvt') sh.levels[+d.li].t = el.value;
  else if (f === 'sh') sh[d.k] = str ? el.value.trim() : (d.k === 'w' || d.k === 'h' ? Math.max(1, int(el.value)) : int(el.value));
  else if (f === 'zone') DB.zones[+d.zi][d.k] = str ? el.value : int(el.value);
  else if (f === 'area') DB.areas[+d.ai][d.k] = d.k === 'type' ? el.value : int(el.value);
  else if (f === 'map') DB.map[d.k] = Math.max(5, int(el.value));
  else if (f === 'prod') { const p = prod(ui.focus); p[d.k] = d.k === 'perBox' ? Math.max(1, int(el.value)) : num(el.value); }
  else if (f === 'model') DB.products.filter(p => p.model === d.m).forEach(p => p[d.k] = d.k === 'box' || d.k === 'cat' ? el.value : Math.max(1, int(el.value)));
  else if (f === 'cap') { const t = DB.levelTypes[+d.i]; t.cap = t.cap || {}; if (el.value === '') delete t.cap[d.b]; else t.cap[d.b] = int(el.value); }
  else if (f === 'lt') DB.levelTypes[+d.i][d.k] = str ? el.value : num(el.value);
  else if (f === 'bt') DB.boxTypes[+d.i][d.k] = str ? el.value : num(el.value);
  else if (f === 'calc') ui.calc[d.k] = el.value;
  else if (f === 'set') DB.settings[d.k] = el.type === 'checkbox' ? el.checked : str ? el.value : num(el.value);
  else return;
  render();
});
$('#moreBtn').addEventListener('click', () => $('#tabs').classList.toggle('more'));
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { ui.tab = b.dataset.tab; render(); } });
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeBtn').textContent = dark ? '☀️' : '🌙';
  $('#themeBtn').title = dark ? 'เปลี่ยนเป็นโหมดสว่าง' : 'เปลี่ยนเป็นโหมดมืด';
}
let theme = null; try { theme = localStorage.getItem('wh2d-theme'); } catch (e) {}
applyTheme(theme);
$('#themeBtn').addEventListener('click', () => {
  const dark = $('#themeBtn').textContent === '☀️';
  theme = dark ? 'light' : 'dark'; applyTheme(theme);
  try { localStorage.setItem('wh2d-theme', theme); } catch (e) {}
});
function setView(v) {
  ui.view = v; $('#viewBtn').textContent = v === '3d' ? '▦ 2D' : '🧊 3D';
  try { localStorage.setItem('wh2d-view', v); } catch (e) {}
}
$('#typebar').addEventListener('click', e => { const b = e.target.closest('[data-tf]'); if (!b) return; ui.tf = ui.tf === +b.dataset.tf ? null : +b.dataset.tf; renderMap(); });
$('#viewBtn').addEventListener('click', () => { if (ui.view === '2d' && ui.edit) setEdit(false); setView(ui.view === '3d' ? '2d' : '3d'); renderMap(); });
try { if (localStorage.getItem('wh2d-view') === '3d') setView('3d'); } catch (e) {}
// X-ray: หาตู้ที่อยู่ใกล้คนดูกว่า (ด้านหน้า) และทับตู้ที่ชี้อยู่บนจอ แล้วทำให้โปร่งใส
let xT = null;
const depth = sh => -0.5 * (sh.x + sh.w / 2) + 0.866 * (sh.y + sh.h / 2);
function rectOf(el) {
  const rs = [...el.querySelectorAll('.f')].map(f => f.getBoundingClientRect());
  return { l: Math.min(...rs.map(r => r.left)), r: Math.max(...rs.map(r => r.right)), t: Math.min(...rs.map(r => r.top)), b: Math.max(...rs.map(r => r.bottom)) };
}
function clearXray() { xT = null; document.querySelectorAll('.s3.xray,.s3.focus').forEach(e => e.classList.remove('xray', 'focus')); }
$('#map').addEventListener('mousemove', e => {
  if (ui.view !== '3d') return;
  // ยังอยู่ในกรอบตู้เดิม → ไม่เปลี่ยนเป้า (กันเด้งไปตู้ด้านหลังตอนตู้ด้านหน้าโปร่งใส)
  const cur = xT && document.querySelector(`.s3[data-shelf="${xT}"]`);
  if (cur) { const r = rectOf(cur); if (e.clientX >= r.l && e.clientX <= r.r && e.clientY >= r.t && e.clientY <= r.b) return; }
  const el = e.target.closest('.s3');
  if (!el) { clearXray(); return; }
  if (el.dataset.shelf === xT) return;
  clearXray(); xT = el.dataset.shelf; el.classList.add('focus');
  const d = depth(shelf(xT)), r = rectOf(el);
  document.querySelectorAll('.s3').forEach(o => {
    if (o === el || depth(shelf(o.dataset.shelf)) <= d) return;
    const q = rectOf(o);
    if (q.l < r.r && q.r > r.l && q.t < r.b && q.b > r.t) o.classList.add('xray');
  });
});
$('#map').addEventListener('mouseleave', clearXray);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(renderMap, 150); });
$('#editBtn').addEventListener('click', () => { setEdit(!ui.edit); render(); });
$('#q').addEventListener('input', e => { ui.q = e.target.value; ui.focus = null; renderMap(); renderResult(); });

/* ================= ลาก/คลิกชั้นวาง ================= */
let drag = null;
const map = $('#map');
map.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-shelf]'); if (!el) return;
  const sh = shelf(el.dataset.shelf);
  drag = { sh, el, sx: e.clientX, sy: e.clientY, ox: sh.x, oy: sh.y, moved: false };
  if (ui.edit && ui.view !== '3d') el.setPointerCapture(e.pointerId);
});
map.addEventListener('pointermove', e => {
  if (!drag || !ui.edit || ui.view === '3d') return;
  const { sh, el } = drag;
  const nx = Math.min(DB.map.cols - sh.w, Math.max(0, drag.ox + Math.round((e.clientX - drag.sx) / CELL)));
  const ny = Math.min(DB.map.rows - sh.h, Math.max(0, drag.oy + Math.round((e.clientY - drag.sy) / CELL)));
  if (nx !== sh.x || ny !== sh.y) { sh.x = nx; sh.y = ny; drag.moved = true; el.style.left = nx * CELL + 3 + 'px'; el.style.top = ny * CELL + 3 + 'px'; }
});
map.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  // อยู่หน้าแผน → คลิกชั้นแล้วดูของที่ "ตามแผน" ในหน้าเดิม (ยังไม่กดใช้แผน ชั้นจริงยังว่าง)
  if (!d.moved) { ui.sel = d.sh.id; if (ui.tab !== 'plan') ui.tab = 'detail'; }
  render();
});

DB = load() || seed();
DB.boxTypes.forEach(b => { if (b.slots == null) b.slots = DEF_SLOTS[b.id] || 1; });
if (!DB.rules) DB.rules = defaultRules();
if (!DB.brandV2) { DB.settings.brandOnly = 'WARRIX, GRAND'; DB.brandV2 = true; }
if (!DB.perBoxV2) { DB.products.forEach(p => { if (p.src === 'sb' && p.perBox === 10) p.perBox = PER_DEF; }); DB.perBoxV2 = true; }
render();
syncCatalog(true);
</script>
</body>
</html>
