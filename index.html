<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polo Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
<script>const MQ = '(max-width: 640px), (pointer: coarse) and (max-height: 500px)';
if (matchMedia(MQ).matches) document.documentElement.classList.add('m');</script>
<style>
  :root {
    --bg: #1b1d22;
    --bg2: #2a2d34;
    --ink: #f3efe9;
    --muted: #9aa0aa;
    --accent: #e0442f;
    --chip: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--bg2) 0%, var(--bg) 70%);
    color: var(--ink);
    font-family: "Kanit", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    user-select: none;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; gap: 12px;
  }
  .brand { font-weight: 600; letter-spacing: .25em; font-size: 15px; }
  .brand span { color: var(--accent); font-weight: 300; letter-spacing: .15em; margin-left: 8px; }
  .tools { display: flex; gap: 8px; }
  button {
    font: inherit; color: var(--ink); background: var(--chip); border: 1px solid rgba(255,255,255,.12);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: background .2s;
  }
  button:hover { background: rgba(255,255,255,.18); }
  button:disabled { opacity: .3; cursor: default; }

  main {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    padding: 8px 64px; position: relative;
  }
  #stage { position: relative; }
  #book { box-shadow: 0 30px 60px -20px rgba(0,0,0,.7); }
  .page { background: #f4f1ec; overflow: hidden; }
  .page img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  /* soft binding shadow on left edge to feel like paper */
  .page::after {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 22px;
    background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,0));
    pointer-events: none;
  }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px; border-radius: 50%; padding: 0; font-size: 22px; line-height: 1;
  }
  .nav.prev { left: 10px; } .nav.next { right: 10px; }

  footer { padding: 6px 16px 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #counter { color: var(--muted); font-size: 14px; }
  #thumbs { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding: 4px 2px 6px; }
  #thumbs img {
    height: 48px; border-radius: 4px; cursor: pointer; opacity: .45;
    border: 2px solid transparent; transition: opacity .2s, border-color .2s, transform .2s;
  }
  #thumbs img:hover { opacity: .85; transform: translateY(-2px); }
  #thumbs img.active { opacity: 1; border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; opacity: .8; }

  @media (max-width: 640px) {
    main { padding: 8px 16px; }
    .nav { display: none; }
    header { padding: 10px 16px; }
    .brand { font-size: 13px; }
    #thumbs img { height: 36px; }
  }

  /* ---------- Mobile version: vertical feed, tap to zoom ---------- */
  #feed, #lb { display: none; }
  html.m, html.m body { height: auto; }
  html.m body { display: block; overflow: auto; -webkit-tap-highlight-color: transparent; }
  html.m header {
    position: sticky; top: 0; z-index: 20; padding: 10px 14px;
    background: rgba(27,29,34,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.08);
  }
  html.m .brand { font-size: 13px; }
  html.m .brand span { display: block; margin: 0; font-size: 10px; letter-spacing: .2em; }
  html.m #fsBtn, html.m #soundBtn, html.m main, html.m .hint { display: none; }
  html.m #feed { display: block; padding: 12px 12px 8px; }
  html.m .card { margin: 0 0 14px; scroll-margin-top: 70px; }
  html.m .card img {
    width: 100%; height: auto; aspect-ratio: 2667 / 1500; display: block; border-radius: 10px;
    box-shadow: 0 10px 24px -10px rgba(0,0,0,.7); background: #f4f1ec;
  }
  html.m .card .cap { margin: 6px 4px 0; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  html.m footer {
    position: sticky; bottom: 0; z-index: 20; padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: rgba(27,29,34,.94); backdrop-filter: blur(8px); border-top: 1px solid rgba(255,255,255,.08);
    gap: 6px;
  }
  html.m #thumbs img { height: 40px; }
  @media (max-height: 500px) {
    html.m header { position: static; padding: 6px 14px; }
    html.m .brand span { display: inline; margin-left: 8px; }
    html.m #feed { padding: 8px 10px 4px; }
    html.m .card { scroll-margin-top: 8px; }
    html.m footer { padding: 4px 10px; }
    html.m #thumbs { display: none; }
    html.m #lb.open img { width: 150vw; margin: 0; }
  }
  html.m #lb {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.94);
    overflow: auto; -webkit-overflow-scrolling: touch;
  }
  html.m #lb.open { display: block; }
  html.m #lb img { display: block; width: 260vw; max-width: none; margin: 20vh 0; }
  html.m #lbClose {
    position: fixed; top: 12px; right: 12px; z-index: 51; width: 44px; height: 44px; padding: 0; font-size: 22px;
    display: none;
  }
  html.m #lb.open ~ #lbClose { display: block; }
</style>
</head>
<body>
<header>
  <div class="brand">WARRIX<span>POLO CATALOG</span></div>
  <div class="tools">
    <button id="soundBtn" title="เสียงพลิกหน้า">🔊</button>
    <button id="fsBtn" title="เต็มจอ">⛶ เต็มจอ</button>
  </div>
</header>

<main>
  <button class="nav prev" id="prevBtn" aria-label="หน้าก่อนหน้า">‹</button>
  <div id="stage"><div id="book"></div></div>
  <button class="nav next" id="nextBtn" aria-label="หน้าถัดไป">›</button>
</main>

<div id="feed"></div>
<div id="lb"></div>
<button id="lbClose" aria-label="ปิด">✕</button>

<footer>
  <div id="counter">1 / 9</div>
  <div id="thumbs"></div>
  <div class="hint">ลากมุมกระดาษ · คลิกขอบหน้า · หรือกดปุ่ม ← → เพื่อพลิกหน้า</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  const TOTAL = 9;
  const RATIO = 1500 / 2667; // page height / width (landscape 16:9)
  const pad = n => String(n).padStart(2, "0");

  const MOBILE = document.documentElement.classList.contains("m");
  // Rotating the phone can switch layout: reload (hash keeps the page).
  addEventListener("resize", () => {
    if (matchMedia(MQ).matches !== MOBILE) location.reload();
  });
  let goTo = i => {};
  const book = document.getElementById("book");
  const thumbs = document.getElementById("thumbs");
  for (let i = 1; i <= TOTAL; i++) {
    const p = document.createElement("div");
    p.className = "page";
    if (i === 1 || i === TOTAL) p.dataset.density = "hard";
    p.innerHTML = `<img src="p${pad(i)}.jpg" alt="หน้า ${i}" ${i > 2 ? 'loading="lazy"' : ""}>`;
    if (!MOBILE) book.appendChild(p);

    const t = document.createElement("img");
    t.src = `t${pad(i)}.jpg`;
    t.alt = `หน้า ${i}`;
    t.onclick = () => goTo(i - 1);
    thumbs.appendChild(t);
  }

  if (MOBILE) {
    const feed = document.getElementById("feed");
    const lb = document.getElementById("lb");
    const counter = document.getElementById("counter");
    for (let i = 1; i <= TOTAL; i++) {
      const c = document.createElement("div");
      c.className = "card"; c.id = "c" + i;
      c.innerHTML = `<img src="p${pad(i)}.jpg" alt="หน้า ${i}" ${i > 2 ? 'loading="lazy"' : ""}>` +
        `<div class="cap"><span>หน้า ${i} / ${TOTAL}</span><span>แตะเพื่อซูม</span></div>`;
      c.querySelector("img").onclick = () => {
        lb.innerHTML = `<img src="p${pad(i)}.jpg" alt="หน้า ${i}">`;
        lb.classList.add("open"); document.body.style.overflow = "hidden";
        requestAnimationFrame(() => { lb.scrollLeft = (lb.scrollWidth - lb.clientWidth) / 2; lb.scrollTop = 0; });
      };
      feed.appendChild(c);
    }
    const closeLb = () => { lb.classList.remove("open"); lb.innerHTML = ""; document.body.style.overflow = ""; };
    document.getElementById("lbClose").onclick = closeLb;
    goTo = i => document.getElementById("c" + (i + 1)).scrollIntoView({ behavior: "smooth", block: "start" });

    let cur = -1;
    function mark(idx) {
      if (idx === cur) return; cur = idx;
      counter.textContent = `${idx + 1} / ${TOTAL}`;
      [...thumbs.children].forEach((t, k) => t.classList.toggle("active", k === idx));
      thumbs.children[idx].scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      history.replaceState(null, "", "#p" + (idx + 1));
    }
    const io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) mark(+e.target.id.slice(1) - 1); });
    }, { rootMargin: "-35% 0px -55% 0px" });
    feed.querySelectorAll(".card").forEach(c => io.observe(c));
    addEventListener("scroll", () => {
      if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) mark(TOTAL - 1);
    }, { passive: true });

    const st = Math.min(TOTAL, Math.max(1, parseInt((location.hash.match(/p(\d+)/) || [])[1] || "1"))) - 1;
    mark(st);
    if (st) setTimeout(() => document.getElementById("c" + (st + 1)).scrollIntoView({ block: "start" }), 50);
  } else {
  // Size one page to fit the available area; the stage is exactly one page wide,
  // so the book opens one landscape sheet at a time.
  function fitSize() {
    const main = document.querySelector("main");
    const cs = getComputedStyle(main);
    const availW = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = main.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    // Hidden/minimized windows can report 0 — keep a sane minimum.
    const w = Math.max(240, Math.floor(Math.min(availW, availH / RATIO)));
    return { w, h: Math.floor(w * RATIO) };
  }

  const { w, h } = fitSize();
  document.getElementById("stage").style.width = w + "px";
  const flip = new St.PageFlip(book, {
    width: w, height: h,
    size: "fixed",
    usePortrait: true,
    showCover: false,
    maxShadowOpacity: 0.6,
    flippingTime: 900,
    drawShadow: true,
    mobileScrollSupport: false,
    swipeDistance: 20,
  });
  flip.loadFromHTML(document.querySelectorAll("#book .page"));

  // Rebuild on resize (debounced) keeping the current page.
  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => location.reload(), 300); // URL hash already holds the current page
  });

  const counter = document.getElementById("counter");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  function update(idx) {
    counter.textContent = `${idx + 1} / ${TOTAL}`;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === TOTAL - 1;
    [...thumbs.children].forEach((t, i) => t.classList.toggle("active", i === idx));
    thumbs.children[idx].scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    history.replaceState(null, "", "#p" + (idx + 1));
  }

  // Paper rustle synthesized with WebAudio (no audio file needed).
  let soundOn = true, actx;
  function rustle() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const dur = 0.45, n = actx.sampleRate * dur;
      const buf = actx.createBuffer(1, n, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) {
        const t = i / n;
        d[i] = (Math.random() * 2 - 1) * Math.pow(Math.sin(Math.PI * t), 2) * (0.6 + 0.4 * Math.random());
      }
      const src = actx.createBufferSource(); src.buffer = buf;
      const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 0.7;
      const g = actx.createGain(); g.gain.value = 0.18;
      src.connect(bp).connect(g).connect(actx.destination);
      src.start();
    } catch (e) {}
  }

  flip.on("flip", e => update(e.data));
  flip.on("changeState", e => { if (e.data === "flipping") rustle(); });

  prevBtn.onclick = () => flip.flipPrev();
  nextBtn.onclick = () => flip.flipNext();
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); flip.flipNext(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); flip.flipPrev(); }
    if (e.key === "Home") flip.flip(0);
    if (e.key === "End") flip.flip(TOTAL - 1);
  });

  const soundBtn = document.getElementById("soundBtn");
  soundBtn.onclick = () => { soundOn = !soundOn; soundBtn.textContent = soundOn ? "🔊" : "🔇"; };
  document.getElementById("fsBtn").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  };

  const start = Math.min(TOTAL, Math.max(1, parseInt((location.hash.match(/p(\d+)/) || [])[1] || "1"))) - 1;
  if (start) flip.turnToPage(start);
  update(start);
  goTo = i => flip.flip(i);
  }
</script>
</body>
</html>
